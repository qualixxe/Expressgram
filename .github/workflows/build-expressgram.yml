name: Build Expressgram

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          link-to-sdk: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build yasm nasm cmake build-essential pkg-config

      - name: Setup Rust and Android targets
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          rustup toolchain install 1.96.1 -t aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build Release APK
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleRelease 2>&1 | tee build.log

      - name: Save build log to repo
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          cp build.log build-log.txt
          git add build-log.txt
          git commit -m "ci: save gradle build log [skip ci]" || true
          git push origin HEAD:dev || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: expressgram-apk
          path: '**/build/outputs/apk/**/release/*.apk'
          retention-days: 7
